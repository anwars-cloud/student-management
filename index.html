<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Management System</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <h1>Student Management System</h1>
        <p>Manage student records easily</p>
    </header>

    <main class="container">

        <section class="form-section">
            <h2>Add New Student</h2>

            <form id="studentForm">
                <label for="name">Student Name</label>
                <input type="text" id="name"
                       placeholder="Enter student name" required>

                <label for="roll">Roll Number</label>
                <input type="text" id="roll"
                       placeholder="Enter roll number" required>

                <label for="email">Email Address</label>
                <input type="email" id="email"
                       placeholder="Enter email address" required>

                <label for="course">Course</label>
                <select id="course" required>
                    <option value="">Select Course</option>
                    <option value="Computer Science">Computer Science</option>
                    <option value="Information Technology">Information Technology</option>
                    <option value="Cloud Computing">Cloud Computing</option>
                    <option value="Data Science">Data Science</option>
                </select>

                <button type="submit">Add Student</button>
            </form>
        </section>

        <section class="table-section">
            <h2>Student Records</h2>

            <div class="table-wrapper">
                <table>
                    <thead>
                        <tr>
                            <th>Roll No.</th>
                            <th>Name</th>
                            <th>Email</th>
                            <th>Course</th>
                            <th>Action</th>
                        </tr>
                    </thead>

                    <tbody id="studentList">
                        <tr>
                            <td colspan="5">No students added yet.</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </section>

    </main>

    <footer>
        <p>Student Management Project | Git & GitHub Practical</p>
    </footer>

    <script>
        const form = document.getElementById("studentForm");
        const studentList = document.getElementById("studentList");
        const students = [];

        function displayStudents() {
            studentList.innerHTML = "";

            if (students.length === 0) {
                studentList.innerHTML =
                    '<tr><td colspan="5">No students added yet.</td></tr>';
                return;
            }

            students.forEach((student, index) => {
                const row = document.createElement("tr");

                [
                    student.roll,
                    student.name,
                    student.email,
                    student.course
                ].forEach(value => {
                    const cell = document.createElement("td");
                    cell.textContent = value;
                    row.appendChild(cell);
                });

                const actionCell = document.createElement("td");
                const deleteButton = document.createElement("button");

                deleteButton.textContent = "Delete";
                deleteButton.className = "delete-btn";

                deleteButton.addEventListener("click", () => {
                    students.splice(index, 1);
                    displayStudents();
                });

                actionCell.appendChild(deleteButton);
                row.appendChild(actionCell);
                studentList.appendChild(row);
            });
        }

        form.addEventListener("submit", function(event) {
            event.preventDefault();

            const roll = document.getElementById("roll").value.trim();

            if (students.some(student => student.roll === roll)) {
                alert("This roll number already exists!");
                return;
            }

            students.push({
                name: document.getElementById("name").value.trim(),
                roll: roll,
                email: document.getElementById("email").value.trim(),
                course: document.getElementById("course").value
            });

            displayStudents();
            form.reset();
        });
    </script>

</body>
</html>
